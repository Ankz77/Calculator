<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 360px;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            color: #333;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Number Buttons */
        .btn-num {
            background-color: #bdc3c7;
            color: #2c3e50;
        }
        .btn-num:hover { background-color: #aab7b8; }

        /* Operator Buttons (+, -, *, /) */
        .btn-op {
            background-color: #f39c12;
            color: white;
        }
        .btn-op:hover { background-color: #d68910; }

        /* Scientific Functions (sin, cos, log) */
        .btn-sci {
            background-color: #3498db;
            color: white;
        }
        .btn-sci:hover { background-color: #2980b9; }

        /* Clear and Equal Buttons */
        .btn-clear {
            background-color: #e74c3c;
            color: white;
            grid-column: span 1;
        }
        
        .btn-equal {
            background-color: #2ecc71;
            color: white;
            grid-column: span 1;
        }

        .btn-equal:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly value="">
    <div class="buttons">
        <!-- Row 1 -->
        <button class="btn-sci" onclick="appendFunction('sin(')">sin</button>
        <button class="btn-sci" onclick="appendFunction('cos(')">cos</button>
        <button class="btn-sci" onclick="appendFunction('tan(')">tan</button>
        <button class="btn-clear" onclick="clearDisplay()">AC</button>

        <!-- Row 2 -->
        <button class="btn-sci" onclick="appendFunction('log(')">log</button>
        <button class="btn-sci" onclick="appendToDisplay('(')">(</button>
        <button class="btn-sci" onclick="appendToDisplay(')')">)</button>
        <button class="btn-op" onclick="appendToDisplay('/')">÷</button>

        <!-- Row 3 -->
        <button class="btn-num" onclick="appendToDisplay('7')">7</button>
        <button class="btn-num" onclick="appendToDisplay('8')">8</button>
        <button class="btn-num" onclick="appendToDisplay('9')">9</button>
        <button class="btn-op" onclick="appendToDisplay('*')">×</button>

        <!-- Row 4 -->
        <button class="btn-num" onclick="appendToDisplay('4')">4</button>
        <button class="btn-num" onclick="appendToDisplay('5')">5</button>
        <button class="btn-num" onclick="appendToDisplay('6')">6</button>
        <button class="btn-op" onclick="appendToDisplay('-')">-</button>

        <!-- Row 5 -->
        <button class="btn-num" onclick="appendToDisplay('1')">1</button>
        <button class="btn-num" onclick="appendToDisplay('2')">2</button>
        <button class="btn-num" onclick="appendToDisplay('3')">3</button>
        <button class="btn-op" onclick="appendToDisplay('+')">+</button>

        <!-- Row 6 -->
        <button class="btn-sci" onclick="appendFunction('sqrt(')">√</button>
        <button class="btn-num" onclick="appendToDisplay('0')">0</button>
        <button class="btn-num" onclick="appendToDisplay('.')">.</button>
        <button class="btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    // Add number or operator to display
    function appendToDisplay(input) {
        display.value += input;
    }

    // Add scientific functions (sin, cos, etc.)
    function appendFunction(func) {
        display.value += func;
    }

    // Clear the entire display
    function clearDisplay() {
        display.value = "";
    }

    // Calculate the result
    function calculate() {
        try {
            let expression = display.value;

            // Replace visual symbols with JS math operators
            expression = expression.replace(/sin/g, 'Math.sin');
            expression = expression.replace(/cos/g, 'Math.cos');
            expression = expression.replace(/tan/g, 'Math.tan');
            expression = expression.replace(/log/g, 'Math.log10'); // log base 10
            expression = expression.replace(/sqrt/g, 'Math.sqrt');
            expression = expression.replace(/×/g, '*');

            // IMPORTANT: JS math functions use Radians, not Degrees.
            // If you want to handle degrees, you would need to wrap arguments in:
            // (deg * Math.PI / 180) inside the function call.
            // For this basic version, we assume standard math (Radians).

            const result = eval(expression);

            // Check for NaN or division by zero results
            if (!isFinite(result)) {
                display.value = "Error";
            } else {
                display.value = result;
            }
        } catch (error) {
            display.value = "Syntax Error";
        }
    }
</script>

</body>
</html>
